<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cabo de Guerra TikTok Live</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fontes Orbitron e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: 'Inter', sans-serif; color: #fff; }
        .font-gamer { font-family: 'Orbitron', sans-serif; }
        #game-wrapper { position: relative; width: 100%; height: 100%; max-width: 500px; margin: 0 auto; background: radial-gradient(circle at center, #11162b 0%, #05050a 100%); overflow: hidden; box-shadow: 0 0 50px rgba(0, 240, 255, 0.15); }
        #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-4px, -4px); }
            80% { transform: translate(4px, 4px); }
        }
        .shake-active { animation: shake 0.4s ease both; }
        .neon-blue { text-shadow: 0 0 10px rgba(0, 210, 255, 0.8); }
        .neon-red { text-shadow: 0 0 10px rgba(255, 42, 109, 0.8); }
        .box-glow-blue { box-shadow: 0 0 20px rgba(0, 210, 255, 0.3), inset 0 0 15px rgba(0, 210, 255, 0.2); }
        .box-glow-red { box-shadow: 0 0 20px rgba(255, 42, 109, 0.3), inset 0 0 15px rgba(255, 42, 109, 0.2); }
        @keyframes corePulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.15); } }
        .energy-core { animation: corePulse 1.2s infinite ease-in-out; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .avatar-pop { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toastSlide { 0% { transform: translateY(-20px); opacity: 0; } 15% { transform: translateY(0); opacity: 1; } 85% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-15px); opacity: 0; } }
        .toast-item { animation: toastSlide 2.5s ease forwards; }
        .btn-tactile:active { transform: scale(0.95); filter: brightness(1.2); }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="fx-canvas"></canvas>

    <!-- Header -->
    <header class="relative z-20 flex items-center justify-between px-4 pt-4 pb-2 bg-gradient-to-b from-black/80 to-transparent">
        <button id="btn-open-config" class="btn-tactile flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/90 border border-slate-700 text-xs font-semibold shadow-lg">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
            <span id="status-text" class="text-slate-300">Desconectado</span>
        </button>
        <div class="flex flex-col items-center">
            <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Tempo</span>
            <span id="timer-display" class="font-gamer text-xl font-black text-amber-400">01:30</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-audio" class="btn-tactile p-2 rounded-full bg-slate-900/90 border border-slate-700 text-cyan-400">🔊</button>
            <button id="btn-toggle-sim" class="btn-tactile p-2 rounded-full bg-indigo-600/90 border border-indigo-400 text-white">⚡</button>
        </div>
    </header>

    <!-- Toasts -->
    <div id="toast-container" class="relative z-20 flex flex-col items-center gap-1.5 px-4 min-h-[60px] pointer-events-none"></div>

    <!-- Arena Principal -->
    <main class="relative z-10 flex flex-col justify-between h-[calc(100%-130px)] px-4 pb-4">
        <!-- Time 1 (Azul) -->
        <section class="relative flex flex-col justify-between flex-1 rounded-2xl bg-cyan-950/30 border border-cyan-500/30 p-3 box-glow-blue overflow-hidden">
            <div class="flex items-center justify-between">
                <div>
                    <span class="inline-block px-2 py-0.5 rounded bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 text-[10px] font-bold uppercase">Chat: 1</span>
                    <h2 class="font-gamer text-lg font-black text-cyan-400 neon-blue">TIME AZUL</h2>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-cyan-300/70 uppercase block">Vitórias</span>
                    <span id="score-blue" class="font-gamer text-2xl font-black text-white">0</span>
                </div>
            </div>
            <div id="avatars-blue" class="flex flex-wrap content-start gap-1.5 my-2 overflow-hidden max-h-[100px]"></div>
            <div class="flex items-center justify-between text-xs text-cyan-300 font-semibold">
                <span>Força: <strong id="power-blue">50%</strong></span>
                <span id="combo-blue" class="text-amber-300 font-gamer">x1.0</span>
            </div>
        </section>

        <!-- Barra do Cabo de Guerra -->
        <div class="relative my-3 h-14 rounded-2xl bg-slate-900/90 border-2 border-slate-700/80 p-1.5 shadow-2xl flex items-center">
            <div id="bar-blue" class="h-full rounded-l-xl bg-gradient-to-r from-blue-600 via-cyan-400 to-cyan-200 transition-all duration-200" style="width: 50%;"></div>
            <div id="bar-red" class="h-full rounded-r-xl bg-gradient-to-l from-rose-700 via-rose-500 to-pink-300 transition-all duration-200" style="width: 50%;"></div>
            <div id="battle-core" class="energy-core absolute top-1/2 w-11 h-11 rounded-full bg-white border-4 border-amber-300 shadow-[0_0_25px_#fff] flex items-center justify-center transition-all duration-200" style="left: 50%;">
                <span class="font-gamer text-xs font-black text-slate-900">VS</span>
            </div>
        </div>

        <!-- Time 2 (Vermelho) -->
        <section class="relative flex flex-col justify-between flex-1 rounded-2xl bg-rose-950/30 border border-rose-500/30 p-3 box-glow-red overflow-hidden">
            <div class="flex items-center justify-between text-xs text-rose-300 font-semibold">
                <span>Força: <strong id="power-red">50%</strong></span>
                <span id="combo-red" class="text-amber-300 font-gamer">x1.0</span>
            </div>
            <div id="avatars-red" class="flex flex-wrap content-end gap-1.5 my-2 overflow-hidden max-h-[100px]"></div>
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="font-gamer text-lg font-black text-rose-400 neon-red">TIME VERMELHO</h2>
                    <span class="inline-block px-2 py-0.5 rounded bg-rose-500/20 border border-rose-400/50 text-rose-300 text-[10px] font-bold uppercase">Chat: 2</span>
                </div>
                <div class="text-left">
                    <span class="text-[10px] text-rose-300/70 uppercase block">Vitórias</span>
                    <span id="score-red" class="font-gamer text-2xl font-black text-white">0</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Painel de Simulação Offline -->
    <div id="sim-panel" class="hidden absolute bottom-4 left-3 right-3 z-30 rounded-2xl bg-slate-900/95 border border-indigo-500/50 p-3.5 shadow-2xl backdrop-blur-md">
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-gamer font-bold text-indigo-300 uppercase">⚡ Simulador Offline</span>
            <button id="btn-close-sim" class="text-slate-400 text-xs px-2 py-1 bg-slate-800 rounded">Fechar ✕</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="simEvent('chat1')" class="btn-tactile py-2 rounded-xl bg-cyan-600/30 border border-cyan-400 text-cyan-200 font-bold text-xs">💬 Chat "1"</button>
            <button onclick="simEvent('chat2')" class="btn-tactile py-2 rounded-xl bg-rose-600/30 border border-rose-400 text-rose-200 font-bold text-xs">💬 Chat "2"</button>
            <button onclick="simEvent('like')" class="btn-tactile py-2 rounded-xl bg-pink-600/30 border border-pink-400 text-pink-200 font-bold text-xs">❤️ Curtida</button>
            <button onclick="simEvent('gift')" class="btn-tactile py-2 rounded-xl bg-amber-500/30 border border-amber-400 text-amber-200 font-bold text-xs">🎁 Presente</button>
        </div>
    </div>

    <!-- Modal de Conexão -->
    <div id="connect-modal" class="absolute inset-0 z-40 flex items-center justify-center p-5 bg-black/85 backdrop-blur-md">
        <div class="w-full rounded-3xl bg-slate-900 border border-slate-700 p-6 shadow-2xl">
            <div class="text-center mb-5">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-rose-500 mb-3 shadow-lg">
                    <span class="font-gamer text-2xl font-black text-white">VS</span>
                </div>
                <h1 class="font-gamer text-xl font-black text-white">CABO DE GUERRA LIVE</h1>
                <p class="text-xs text-slate-400 mt-1">Conecte sua transmissão informando seu @usuario</p>
            </div>
            <div class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Seu @usuario do TikTok</label>
                    <input id="input-username" type="text" value="farid._alhassan" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">URL do Servidor WebSocket (Ponte)</label>
                    <input id="input-ws-url" type="text" value="wss://cabo-de-guerra-live.onrender.com" class="w-full px-3.5 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <p id="connect-error" class="hidden text-xs text-rose-400 font-semibold text-center"></p>
                <button id="btn-connect-ws" class="btn-tactile w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-gamer font-bold text-sm text-white shadow-lg">
                    CONECTAR À LIVE
                </button>
                <button id="btn-offline-mode" class="btn-tactile w-full py-3 rounded-xl bg-slate-800 border border-slate-600 font-semibold text-xs text-slate-200">
                    Jogar Offline (Modo Teste)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
class SoundEngine {
    constructor() { this.ctx = null; this.enabled = true; }
    unlock() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, type, dur, vol=0.15) {
        if (!this.enabled || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    }
}
const sfx = new SoundEngine();

const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [], stars = [];

function resize() {
    const wrap = document.getElementById('game-wrapper');
    canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

for(let i=0; i<40; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2+0.5, speed: Math.random()*0.3+0.1});

function spawnParts(x, y, color, count=15) {
    for(let i=0; i<count; i++) {
        const angle = Math.random()*Math.PI*2, speed = Math.random()*4+1;
        particles.push({x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1, decay: Math.random()*0.03+0.02, size: Math.random()*3+2, color});
    }
}

function loopFX() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    stars.forEach(s => {
        s.y += s.speed; if(s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; }
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    });
    for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if(p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loopFX);
}
loopFX();

const state = { balance: 50, scoreBlue: 0, scoreRed: 0, comboBlue: 1, comboRed: 1, time: 90, isOver: false, players: {}, ws: null };

function updateUI() {
    state.balance = Math.max(0, Math.min(100, state.balance));
    document.getElementById('bar-blue').style.width = `${state.balance}%`;
    document.getElementById('bar-red').style.width = `${100 - state.balance}%`;
    document.getElementById('battle-core').style.left = `${state.balance}%`;
    document.getElementById('power-blue').textContent = `${Math.round(state.balance)}%`;
    document.getElementById('power-red').textContent = `${Math.round(100 - state.balance)}%`;
    document.getElementById('combo-blue').textContent = `x${state.comboBlue.toFixed(1)}`;
    document.getElementById('combo-red').textContent = `x${state.comboRed.toFixed(1)}`;

    if(!state.isOver && (state.balance >= 100 || state.balance <= 0)) {
        endRound(state.balance >= 100 ? 'blue' : 'red');
    }
}

function showToast(text, border='border-slate-600') {
    const t = document.createElement('div');
    t.className = `toast-item px-3.5 py-1.5 rounded-full bg-slate-900/95 border ${border} text-xs font-semibold text-white shadow-lg`;
    t.innerHTML = text;
    document.getElementById('toast-container').appendChild(t);
    if(document.getElementById('toast-container').children.length > 2) document.getElementById('toast-container').firstChild.remove();
    setTimeout(() => { if(t.parentNode) t.remove(); }, 2500);
}

function addPlayer(user, team) {
    const name = user || 'Espectador';
    state.players[name] = team;
    const badge = document.createElement('div');
    badge.className = `avatar-pop px-2 py-1 rounded-full text-[11px] font-bold border ${team==='blue'?'bg-cyan-900/80 border-cyan-400 text-cyan-100':'bg-rose-900/80 border-rose-400 text-rose-100'}`;
    badge.textContent = name;
    const container = document.getElementById(team==='blue'?'avatars-blue':'avatars-red');
    container.prepend(badge);
    if(container.children.length > 12) container.lastChild.remove();
}

function pushTeam(team, amount) {
    if(state.isOver) return;
    const mult = team === 'blue' ? state.comboBlue : state.comboRed;
    const val = amount * mult;
    if(team === 'blue') state.balance += val; else state.balance -= val;
    spawnParts(canvas.width/2, canvas.height/2, team === 'blue' ? '#22d3ee' : '#fb7185', 15);
    updateUI();
}

function handleEvent(data) {
    if(!data || !data.type) return;
    const user = data.user || 'Participante';
    if(data.type === 'chat') {
        const msg = (data.comment||'').trim();
        if(msg === '1') { addPlayer(user, 'blue'); pushTeam('blue', 2); sfx.tone(520, 'sine', 0.15); showToast(`🔵 <b>${user}</b> no Time Azul!`, 'border-cyan-400'); }
        else if(msg === '2') { addPlayer(user, 'red'); pushTeam('red', 2); sfx.tone(440, 'triangle', 0.15); showToast(`🔴 <b>${user}</b> no Time Vermelho!`, 'border-rose-400'); }
    } else if(data.type === 'like') {
        sfx.tone(880, 'sine', 0.1);
        pushTeam(Math.random()>0.5?'blue':'red', 3);
        showToast(`❤️ <b>${user}</b> enviou curtida!`, 'border-pink-400');
    } else if(data.type === 'gift') {
        sfx.tone(600, 'sawtooth', 0.3);
        pushTeam(state.balance < 50 ? 'blue' : 'red', 10);
        showToast(`🎁 <b>${user}</b> enviou ${data.giftName||'Presente'}!`, 'border-amber-400');
    }
}

setInterval(() => {
    if(state.isOver) return;
    if(state.time > 0) {
        state.time--;
        const m = String(Math.floor(state.time/60)).padStart(2,'0');
        const s = String(state.time%60).padStart(2,'0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
    } else {
        endRound(state.balance >= 50 ? 'blue' : 'red');
    }
}, 1000);

function endRound(winner) {
    state.isOver = true;
    if(winner === 'blue') { state.scoreBlue++; document.getElementById('score-blue').textContent = state.scoreBlue; }
    else { state.scoreRed++; document.getElementById('score-red').textContent = state.scoreRed; }
    showToast(`🏆 ${winner==='blue'?'TIME AZUL':'TIME VERMELHO'} VENCEU A RODADA!`, 'border-amber-400');
    setTimeout(resetRound, 3500);
}

function resetRound() {
    state.balance = 50; state.time = 90; state.isOver = false; state.players = {};
    document.getElementById('avatars-blue').innerHTML = '';
    document.getElementById('avatars-red').innerHTML = '';
    updateUI();
}

document.getElementById('btn-connect-ws').addEventListener('click', () => {
    sfx.unlock();
    const url = document.getElementById('input-ws-url').value.trim();
    const username = document.getElementById('input-username').value.trim();
    const err = document.getElementById('connect-error');
    if(!url) { err.textContent = 'Informe a URL do WebSocket'; err.classList.remove('hidden'); return; }

    try {
        if(state.ws) state.ws.close();
        state.ws = new WebSocket(url);
        state.ws.onopen = () => {
            document.getElementById('connect-modal').classList.add('hidden');
            document.getElementById('status-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
            document.getElementById('status-text').textContent = 'Conectado';
            if(username) state.ws.send(JSON.stringify({action:'join', uniqueId: username}));
            showToast('🟢 Conectado à live!', 'border-emerald-400');
        };
        state.ws.onmessage = e => { try { handleEvent(JSON.parse(e.data)); } catch(err){} };
        state.ws.onerror = () => { err.textContent = 'Falha ao conectar no servidor WebSocket.'; err.classList.remove('hidden'); };
    } catch(e) { err.textContent = 'Erro ao iniciar conexão.'; err.classList.remove('hidden'); }
});

document.getElementById('btn-offline-mode').addEventListener('click', () => {
    sfx.unlock();
    document.getElementById('connect-modal').classList.add('hidden');
    document.getElementById('sim-panel').classList.remove('hidden');
    showToast('🎮 Modo Offline Ativado!', 'border-indigo-400');
});

document.getElementById('btn-open-config').addEventListener('click', () => { sfx.unlock(); document.getElementById('connect-modal').classList.remove('hidden'); });
document.getElementById('btn-toggle-sim').addEventListener('click', () => { sfx.unlock(); document.getElem
